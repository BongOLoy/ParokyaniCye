<!DOCTYPE html>

        header {
            background-color: #0038A8;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .section-box {
            width: 80%;
            margin: 25px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #0038A8;
            border-radius: 10px;
        }

        .photo {

        }

        .links {
            width: 80%;
            margin: 25px auto;
            display: flex;
            justify-content: space-between;
        }

        .left-links,
        .right-links {
            padding: 15px;
        }

        .links a {
            display: block;
            margin: 8px;
            padding: 10px 15px;
            background-color: #0038A8;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .links a:hover {
            background-color: #CE1126;
        }

        footer {
            background-color: #0038A8;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>

    
    <link rel="stylesheet" href="style.css">
