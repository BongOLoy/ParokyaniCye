<!DOCTYPE html>

<html>

<head>
    <title>My Homepage</title>
<style>
    body {
        background-color: #F0FFF0;
        font-family: Arial;
        margin: 0;
    }

    header {
        background-color: #0038A8;
        color: white;
        text-align: center;
        padding: 25px;
    }

    .section-box {
        width: 80%;
        margin: 25px auto;
        padding: 20px;
        background-color: white;
        border: 2px solid #0038A8;
        border-radius: 10px;
    }

    .photo {
        background-color: #E6E6FA;
        text-align: center;
    }

    .links {
        width: 80%;
        margin: 25px auto;
        display: flex;
        justify-content: space-between;
        gap: 30px;
    }

    .left-links,
    .right-links {
        padding: 15px;
    }

    .links a {
        display: block;
        margin: 10px;
        padding: 11px 24px;
        background-color: #0038A8;
        color: white;
        text-decoration: none;
        text-align: center;
        font-family: Arial;
        font-size: 15px;
        font-weight: normal;
        letter-spacing: 0.5px;
        border-radius: 10px;
        transition: 0.3s;
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.12);
    }

    .links a:hover {
        background-color: #CE1126;
        transform: translateY(-2px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.18);
    }

    footer {
        background-color: #0038A8;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
    }
</style>

<link rel="stylesheet" href="style.css">


</head>
